[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cell2sentence"
version = "0.1.0"
description = "Cell2Sentence: Single-cell Analysis With LLMs"
readme = "README.md"
requires-python = ">=3.8, <3.9"
license = {text = "Apache License 2.0"}
authors = [
    {name = "Syed Asad Rizvi", email = "syed.rizvi@yale.edu"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
]
dependencies = [
    "accelerate>=1.0.1",
    "anndata>=0.9.2",
    "datasets>=3.1.0",
    "gdown>=5.2.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.3.8",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "plotnine>=0.12.4",
    "scanpy>=1.9.8",
    "scikit-learn>=1.3.2",
    "scipy>=1.10.1",
    "sphinx>=7.1.2",
    "sphinx-rtd-theme>=3.0.2",
    "torch>=2.4.1",
    "tqdm>=4.67.1",
    "transformers>=4.46.3",
]

[project.urls]
Homepage = "https://github.com/vandijklab/cell2sentence"
"Bug Tracker" = "https://github.com/vandijklab/cell2sentence/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]
